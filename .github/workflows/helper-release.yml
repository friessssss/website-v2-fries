name: helper-release

on:
  push:
    tags: ['helper-v*']
    branches: [main]
    paths:
      - 'helper/**'
      - '.github/workflows/helper-release.yml'
  pull_request:
    paths:
      - 'helper/**'
      - '.github/workflows/helper-release.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.24'
          cache-dependency-path: helper/go.sum
      - name: Test
        run: go test ./...
      - name: Vet (linux)
        run: go vet ./...
      - name: Vet (windows)
        run: GOOS=windows GOARCH=amd64 go vet ./...

  release:
    if: startsWith(github.ref, 'refs/tags/helper-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.24'
          cache-dependency-path: helper/go.sum
      - name: Build
        working-directory: helper
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          VERSION="${TAG#helper-v}"
          go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=${VERSION} -X main.baseURL=https://zachrobertson.co" \
            -o RLGoalTracker.exe .
          sha256sum RLGoalTracker.exe > RLGoalTracker.exe.sha256
          cat RLGoalTracker.exe.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2.2.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            helper/RLGoalTracker.exe
            helper/RLGoalTracker.exe.sha256
